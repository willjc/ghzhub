# ===========================================================
# 互联网区转发服务器 Nginx 配置
# 部署位置：172.27.139.244:/etc/nginx/conf.d/ghz-gov-proxy.conf
# 功能：接收公网 42.228.16.25:8088 进来的请求，转发到 172.19.25.77:9001
# ===========================================================

server {
    # 监听 8088 端口（公网 42.228.16.25:8088 NAT 映射到这里）
    listen 8088;
    server_name _;

    # 允许的请求体大小（身份证+姓名很小，10M 足够）
    client_max_body_size 10m;

    # 访问日志 & 错误日志（便于排错）
    access_log /var/log/nginx/ghz-gov-proxy.access.log;
    error_log  /var/log/nginx/ghz-gov-proxy.error.log;

    location / {
        # 转发到政务外网主机的 jar 服务
        proxy_pass http://172.19.25.77:9001;

        # 透传关键请求头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        #   政务侧婚姻/不动产接口响应时间最慢可达 20~25 秒
        #   这里预留 60 秒，覆盖最坏情况
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        # 不缓存政务响应
        proxy_buffering off;
    }

    # 健康检查直通
    location = /api/v1/gov/ping {
        proxy_pass http://172.19.25.77:9001/api/v1/gov/ping;
    }
}
